<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan/Sky Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1544" height="500" fill="url(#bg)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#0284c7" opacity="0.2" filter="url(#glow)" />
  <circle cx="1350" cy="380" r="220" fill="#0369a1" opacity="0.18" filter="url(#glow)" />

  <!-- Shield + Chat Graphic (Left Hero Asset) -->
  <g transform="translate(140, 75)">
    <!-- Shield Base -->
    <path d="M175 25 L290 70 V185 C290 275 175 345 175 345 C175 345 60 275 60 185 V70 Z" 
          fill="url(#accent)" 
          stroke="rgba(255, 255, 255, 0.2)" 
          stroke-width="5" />

    <!-- Chat Bubble Inside -->
    <path d="M175 90 C125 90 85 125 85 168 C85 193 98 215 118 229 L111 265 L148 244 C157 247 166 248 175 248 C225 248 265 213 265 168 C265 125 225 90 175 90 Z" 
          fill="#ffffff" />

    <!-- Switch Track & Active Node -->
    <rect x="130" y="156" width="90" height="24" rx="12" fill="#e2e8f0" />
    <circle cx="200" cy="168" r="15" fill="#0284c7" />
    <path d="M196 168 L199 171 L205 165" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography & Copy (Right) -->
  <g transform="translate(540, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="168" height="32" rx="16" fill="#0369a1" opacity="0.5" />
    <text x="84" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ZERO-BLOAT</text>

    <!-- Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Comment Control</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#94a3b8">
      Granular Governance • Invisible Anti-Spam Shield • 100% GDPR Ready
    </text>

    <!-- Bullet Specs -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ 0 KB Frontend</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="275" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ Invisible Honeypot</text>

      <!-- Pill 3 -->
      <rect x="385" y="0" width="195" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="482" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">🔒 IP Anonymization</text>
    </g>
  </g>
</svg>
